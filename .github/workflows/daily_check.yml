name: Daily Grant Checker

on:
  schedule:
    - cron: '0 8 * * *' # ירוץ אוטומטית בכל יום ב-08:00 בבוקר
  workflow_dispatch: # מאפשר להריץ ידנית בלחיצת כפתור לבדיקה

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Grant Checker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
